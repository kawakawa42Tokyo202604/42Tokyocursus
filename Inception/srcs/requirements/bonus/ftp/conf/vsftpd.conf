listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
check_shell=NO

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=__FTP_PASV_ADDRESS__

hide_ids=YES
utf8_filesystem=YES
ftpd_banner=Inception FTP server
